name: Full Stack CI (React + Java)

on:
  push:
    branches: ["githubActions"]
  pull_request:
    branches: ["githubActions"]
  workflow_dispatch: # Allow manual runs from GitHub UI

jobs:
  # 🧪 FRONTEND TESTS
  frontend-tests:
    name: Run Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ../frontend/pack-eats
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run React tests
        run: npm test -- --watchAll=false

  # ⚙️ BACKEND TESTS
  backend-tests:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ../backend/pack-eats
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build and test backend (Maven)
        run: mvn clean test
        # 👇 If you use Gradle instead, replace with:
        # run: ./gradlew test
