name: CI - Frontend and Backend Tests

on:
  push:
    branches: [ githubActions ]
  pull_request:
    branches: [ githubActions ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'  # you can also use 'zulu'
          java-version: '21'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and Test Backend
        working-directory: proj2/backend/pack-eats
        run: mvn clean test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: proj2/frontend/pack-eats/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: proj2/frontend/pack-eats
        run: |
          npm install

      # fix permission issues for react-scripts
      - name: Ensure react-scripts is executable
        working-directory: proj2/frontend/pack-eats
        run: chmod +x node_modules/.bin/react-scripts

      - name: Run Frontend Tests
        working-directory: proj2/frontend/pack-eats
        run: npm test -- --watchAll=false
