name: CI - Frontend & Backend Tests with Coverage

on:
  push:
    branches: [ githubActions, main ]
  pull_request:
    branches: [ githubActions, main ]

jobs:
  AutomatedTestScript:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build & Run Backend Tests with Coverage
        working-directory: proj2/backend/pack-eats
        run: mvn clean verify
        env:
          MAVEN_OPTS: "-Dmaven.test.failure.ignore=true"

      - name: Upload Backend Test Report
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: |
            proj2/backend/pack-eats/target/surefire-reports/
            proj2/backend/pack-eats/target/site/jacoco/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: proj2/frontend/pack-eats/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: proj2/frontend/pack-eats
        run: npm install

      - name: Ensure react-scripts is executable
        working-directory: proj2/frontend/pack-eats
        run: chmod +x node_modules/.bin/react-scripts

      - name: Run Frontend Tests with Coverage
        working-directory: proj2/frontend/pack-eats
        run: |
          npm test -- --watchAll=false --coverage --json --outputFile=test-results.json
        continue-on-error: true

      - name: Upload Frontend Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: proj2/frontend/pack-eats/coverage

      - name: Upload Frontend Test Results
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: proj2/frontend/pack-eats/test-results.json


      - name: Summarize Test Results
        run: |
          echo "### ✅ Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Backend:** Maven Surefire & JaCoCo reports generated." >> $GITHUB_STEP_SUMMARY
          echo "**Frontend:** Jest coverage and test results uploaded." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download full reports from the *Artifacts* section below." >> $GITHUB_STEP_SUMMARY
